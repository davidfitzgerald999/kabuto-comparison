<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="dark"><title>KABUTO · Colour studio</title>
<style>
@font-face{font-family:Kabuto;src:url('kabuto-ui-serif.woff2') format('woff2');font-display:swap}*{box-sizing:border-box}html,body{margin:0;background:#12191c;color:#eee7d8;font:14px/1.5 Arial,Helvetica,sans-serif}button{font:inherit;cursor:pointer;touch-action:manipulation}button:focus-visible{outline:2px solid #e1c68e;outline-offset:3px}.stage{position:relative;width:100%;aspect-ratio:16/9;background:#10171a}.stage video,.stage img{display:block;position:absolute;inset:0;width:100%;height:100%;object-fit:contain}.stage img[hidden]{display:none}.eyebrow{position:absolute;left:4%;top:5%;font-size:clamp(8px,1vw,12px);letter-spacing:.15em;color:#d5bf93;text-shadow:0 1px 8px #000}.controls{height:224px;padding:21px 4% 15px;border-top:1px solid #354346;background:linear-gradient(110deg,#1c282b,#12191c);display:flex;flex-direction:column;justify-content:space-between;gap:12px}.top{display:flex;justify-content:space-between;align-items:center;gap:16px}.meta{min-width:0}.meta strong{display:block;font:400 22px/1.2 Kabuto,Georgia,serif}.meta small{display:block;color:#b8c2bd;font-size:10px;letter-spacing:.12em;margin-top:7px}.actions{display:flex;gap:8px;flex-shrink:0}.action{min-height:44px;padding:10px 16px;border:1px solid #b46654;border-radius:3px;background:#8d362a;color:#eee7d8;font-weight:600;white-space:nowrap}.action:hover{background:#a34938}.action.secondary{border-color:#52615e;background:transparent;font-weight:400;min-width:77px}.action.secondary:hover{background:#273438}.swatches{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:8px;max-width:620px;width:100%}.swatch{height:40px;border:1px solid #596362;padding:4px;background:#10191c;border-radius:3px;position:relative}.swatch span{display:block;height:100%;border-radius:1px}.swatch[aria-pressed=true]{border:2px solid #e7cc99;padding:3px;box-shadow:0 0 0 2px #b6935033}.swatch[aria-pressed=true]:after{content:'✓';position:absolute;inset:0;display:grid;place-items:center;color:white;text-shadow:0 1px 4px #000;font-weight:bold}.caption{margin:0;color:#aab8b7;font-size:11px;line-height:1.5}.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}
@media(max-width:620px){.controls{padding:15px 4% 12px;gap:10px}.top{align-items:flex-start;flex-direction:column;gap:10px}.meta{display:flex;align-items:baseline;justify-content:space-between;width:100%;gap:8px}.meta strong{font-size:17px}.meta small{margin:0;font-size:9px}.actions{width:100%}.action{flex:1;font-size:12px;min-height:40px;padding:8px 10px}.swatches{gap:5px}.swatch{height:32px;padding:2px}.swatch[aria-pressed=true]{padding:1px}.caption{font-size:10px}}
</style></head><body>
<main aria-label="KABUTO interactive colour palette preview">
<div class="stage"><video id="film" muted loop playsinline preload="metadata" poster="kabuto-colours-poster.webp" aria-label="Ten colour palettes under rotating world lighting"><source src="kabuto-colours-1080p.mp4" type="video/mp4"></video><img id="still" src="kabuto-palette-01.webp" width="1920" height="1080" alt="Charcoal and teal palette on the same KABUTO assembly"><span class="eyebrow">KABUTO / COLOUR STUDIO</span></div>
<div class="controls"><div class="top"><div class="meta"><strong id="name">Charcoal / teal</strong><small id="number">PALETTE 01 / 10</small></div><div class="actions"><button class="action" id="randomise">↻ &nbsp; Randomise colours</button><button class="action secondary" id="play" aria-pressed="false">▶ &nbsp; Play loop</button></div></div><div class="swatches" id="swatches" aria-label="Choose one of the ten palettes"></div><p id="caption" class="caption">Choose a palette or play the 360° lighting loop. Reference head not included.</p><p class="sr" id="announcement" role="status" aria-live="polite"></p></div>
</main>
<script>
const palettes=[{"name": "Charcoal / teal", "colours": ["#2c343b", "#ffdb98", "#2f6c73"], "still": "kabuto-palette-01.webp", "time": 0.6666666666666666}, {"name": "Vermilion / midnight", "colours": ["#89241d", "#edc8b3", "#2c3748"], "still": "kabuto-palette-02.webp", "time": 2.6666666666666665}, {"name": "Forest / flax", "colours": ["#2d4b3f", "#f6dfaa", "#6f522f"], "still": "kabuto-palette-03.webp", "time": 4.666666666666667}, {"name": "Indigo / crimson", "colours": ["#2c3c5b", "#e5e7ea", "#73271d"], "still": "kabuto-palette-04.webp", "time": 6.666666666666667}, {"name": "Bronze / pine", "colours": ["#73593c", "#ebd3a6", "#27352d"], "still": "kabuto-palette-05.webp", "time": 8.666666666666666}, {"name": "Black / gold / ivory", "colours": ["#161718", "#f9dea2", "#b8aa8e"], "still": "kabuto-palette-06.webp", "time": 10.666666666666666}, {"name": "Black / silver / scarlet", "colours": ["#1d1f24", "#e6ebf1", "#952421"], "still": "kabuto-palette-07.webp", "time": 12.666666666666666}, {"name": "Ivory / indigo", "colours": ["#c5b597", "#ebdab8", "#24304d"], "still": "kabuto-palette-08.webp", "time": 14.666666666666666}, {"name": "Plum / flax / teal", "colours": ["#57243d", "#f0e1ba", "#aa9573"], "still": "kabuto-palette-09.webp", "time": 16.666666666666668}, {"name": "Olive / ochre", "colours": ["#4d522e", "#e5cd99", "#a29376"], "still": "kabuto-palette-10.webp", "time": 18.666666666666668}];
const film=document.getElementById('film'),still=document.getElementById('still'),play=document.getElementById('play'),nameLabel=document.getElementById('name'),number=document.getElementById('number'),caption=document.getElementById('caption');
const reduced=matchMedia('(prefers-reduced-motion:reduce)');let current=0,wantPlay=false,visible=false,selection=0,pendingTime=null;
const buttons=palettes.map((p,i)=>{const b=document.createElement('button');b.type='button';b.className='swatch';b.title=p.name;b.setAttribute('aria-label',p.name);b.setAttribute('aria-pressed',String(i===0));const chip=document.createElement('span');chip.style.background=`linear-gradient(115deg,${p.colours[0]} 0 60%,${p.colours[1]} 60% 77%,${p.colours[2]} 77% 100%)`;chip.setAttribute('aria-hidden','true');b.append(chip);b.addEventListener('click',()=>select(i));document.getElementById('swatches').append(b);return b});
function label(i,announce=false){current=i;nameLabel.textContent=palettes[i].name;number.textContent='PALETTE '+String(i+1).padStart(2,'0')+' / 10';buttons.forEach((b,j)=>b.setAttribute('aria-pressed',String(i===j)));if(announce)document.getElementById('announcement').textContent=palettes[i].name+' selected.'}
function playLabel(){play.setAttribute('aria-pressed',String(wantPlay));play.textContent=wantPlay?'Ⅱ  Pause loop':'▶  Play loop'}
function select(i){const token=++selection;wantPlay=false;film.pause();playLabel();const image=new Image();image.onload=()=>{if(token!==selection)return;still.src=palettes[i].still;still.alt=palettes[i].name+' palette on the same KABUTO assembly';still.hidden=false;label(i,true);pendingTime=palettes[i].time;if(film.readyState>=1){film.currentTime=pendingTime;pendingTime=null}caption.textContent='Rendered palette preview. Each click advances the palette, as in the add-on.'};image.onerror=()=>{caption.textContent='This palette image could not load. Try the lighting loop.'};image.src=palettes[i].still}
async function synchronise(){if(!wantPlay||!visible||document.hidden){film.pause();return}try{await film.play()}catch(e){wantPlay=false;playLabel();caption.textContent='Press Play loop to start the animation.'}}
document.getElementById('randomise').addEventListener('click',()=>select((current+1)%palettes.length));
play.addEventListener('click',()=>{++selection;wantPlay=!wantPlay;playLabel();if(wantPlay){caption.textContent='Ten rendered palettes · one full turn of world lighting · reference head not included.'}synchronise()});
film.addEventListener('loadedmetadata',()=>{if(pendingTime!==null){film.currentTime=pendingTime;pendingTime=null}});
film.addEventListener('playing',()=>{still.hidden=true});
film.addEventListener('timeupdate',()=>{if(!film.paused){label(Math.min(9,Math.floor(film.currentTime/2)));const t=film.currentTime%2;if(t>=40/24)number.textContent='PALETTE TRANSITION'}});
film.addEventListener('error',()=>{wantPlay=false;playLabel();still.hidden=false;caption.textContent='Video unavailable. You can still choose the rendered palettes above.'});
document.addEventListener('visibilitychange',synchronise);
new IntersectionObserver(entries=>{visible=entries[0].isIntersecting;synchronise()},{threshold:.15}).observe(document.querySelector('main'));
reduced.addEventListener('change',()=>{if(reduced.matches){wantPlay=false;playLabel();synchronise()}});
if(new URLSearchParams(location.search).get('autoplay')==='1'&&!reduced.matches){wantPlay=true;playLabel()}
// Cache the ten small stills serially; the HD video loads through the browser.
(async()=>{for(const p of palettes){await new Promise(resolve=>{const image=new Image();image.onload=image.onerror=resolve;image.src=p.still})}})();
</script></body></html>
