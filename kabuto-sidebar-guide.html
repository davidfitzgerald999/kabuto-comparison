<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="dark"><title>KABUTO · Explore the sidebar</title><style>
@font-face{font-family:Kabuto;src:url('kabuto-ui-serif.woff2') format('woff2');font-display:swap}*{box-sizing:border-box}html,body{margin:0;background:#12191c;color:#eee7d8;font:14px/1.55 Arial,sans-serif}button{font:inherit;cursor:pointer;touch-action:manipulation}button:focus-visible,a:focus-visible{outline:2px solid #e1c68e;outline-offset:3px}main{height:840px;padding:24px 4%;display:flex;flex-direction:column;gap:20px}.intro{margin:0;color:#b1beb9;font-size:12px}.tabs{display:flex;gap:8px;flex-wrap:wrap}.tab{border:1px solid #4d5b58;background:transparent;color:#bfc9c3;padding:9px 14px;border-radius:3px;font-size:12px}.tab[aria-pressed=true]{background:#8d362a;border-color:#b36a55;color:#eee7d8}.content{display:grid;grid-template-columns:minmax(210px,280px) minmax(0,1fr);gap:32px;flex:1;min-height:0}.shot-wrap{width:100%;max-width:260px;margin:auto auto 0;align-self:start;margin-top:0}.shot{position:relative;width:100%;overflow:visible;background:#383838;aspect-ratio:368/760;border:1px solid #5a6861;box-shadow:0 16px 45px #0004}.crop{position:absolute;inset:0;overflow:hidden}.crop img{position:absolute;max-width:none;width:695.652174%;height:auto;left:-463.315217%;top:-32.236842%;display:block}.hotspot{position:absolute;left:4%;width:91%;padding:0;background:transparent;border:1px solid transparent;border-radius:2px}.hotspot:hover,.hotspot[aria-pressed=true]{border-color:#dfbc7d;background:#dac0910b}.hotspot span{position:absolute;left:-14px;top:50%;transform:translateY(-50%);width:27px;height:27px;border-radius:50%;background:#8d362a;border:1px solid #dba17b;color:#f5ead7;display:grid;place-items:center;font-size:12px;box-shadow:0 2px 8px #0008}.shot-note{font-size:10px;color:#9dabaa;line-height:1.6;margin:12px 0}.shot-note a{color:#ccb488}.notes{padding-top:7px}.eyebrow{font-size:10px;letter-spacing:.14em;color:#c8ab78;margin:0 0 12px}.notes h2{font:400 30px/1.2 Kabuto,Georgia,serif;margin:0 0 22px}.topic-list{display:flex;flex-direction:column;gap:8px;margin-bottom:28px}.topic{border:1px solid #3e504f;border-radius:3px;background:#192629;color:#bbc9c2;text-align:left;padding:10px 13px;font-size:12px}.topic[aria-pressed=true]{border-color:#a77855;color:#eee7d8;background:#2b302b}.explanation{border-top:1px solid #4c5750;padding-top:23px}.explanation h3{font:400 24px/1.25 Kabuto,Georgia,serif;margin:0 0 13px}.explanation p{color:#c1cbc6;margin:0;font-size:14px;line-height:1.8}.tip{margin-top:22px!important;padding:12px 14px;border-left:2px solid #8d362a;background:#192629;font-size:12px!important;color:#9eafac!important}.footer{margin:0;color:#97aaa7;font-size:10px}
@media(max-width:620px){main{padding:16px 5%;gap:13px}.intro{font-size:10px}.tabs{gap:6px}.tab{font-size:11px;padding:8px 10px}.content{display:flex;flex-direction:column;gap:14px;flex:none}.shot-wrap{width:190px;margin:0 auto}.shot-note{display:none}.notes{padding-top:0}.eyebrow,.notes h2{display:none}.topic-list{flex-direction:row;gap:5px;flex-wrap:wrap;margin-bottom:12px}.topic{font-size:10px;padding:6px 8px}.explanation{padding-top:12px}.explanation h3{font-size:21px;margin-bottom:8px}.explanation p{font-size:12px;line-height:1.65}.tip{margin-top:10px!important;padding:8px 11px;font-size:10px!important}.footer{margin-top:auto;font-size:9px}.hotspot span{width:23px;height:23px;left:-12px;font-size:10px}}
</style></head><body><main aria-label="Interactive guide to the KABUTO Blender sidebar"><p class="intro">Choose a panel, then click a numbered control to see what it does.</p><nav class="tabs" aria-label="Sidebar panels"></nav><div class="content"><div class="shot-wrap"><div class="shot"><div class="crop"><img id="screenshot" src="kabuto-sidebar-assembly.webp" alt="Actual KABUTO Assembly sidebar in Blender" width="2560" height="1494"></div><div id="hotspots"></div></div><p class="shot-note">Actual add-on screenshot.<br><a id="full-image" href="kabuto-sidebar-assembly.webp" target="_blank" rel="noopener">Open full Blender view ↗</a></p></div><section class="notes"><p class="eyebrow">INSIDE THE ADD-ON</p><h2 id="panel-title">Build the assembly.</h2><div class="topic-list" aria-label="Choose a control"></div><div class="explanation" aria-live="polite"><h3 id="control-title"></h3><p id="description"></p><p id="tip" class="tip"></p></div></section></div><p class="footer">Interactive guide to real controls. Changes to your model are made in Blender.</p></main><script>
const panels=[
{label:'Assembly',title:'Build the assembly.',file:'kabuto-sidebar-assembly.webp',crop:245,topics:[
{short:'Generate',title:'Randomise assembly & seed',y:294,h:125,text:'Generate another compatible arrangement, or enter a seed to revisit a generated starting point. Include colours controls whether assembly randomisation also changes the palette.',tip:'Save the .blend to preserve the complete look, including later material and fitting edits.'},
{short:'Choose parts',title:'Choose every component',y:462,h:315,text:'Pick the helmet bowl, rear guard, face armour, front crest and emblem individually. You can refine a generated arrangement one component at a time.',tip:'An emblem needs a compatible emblem-frame crest. Helmet attachments depend on a helmet being present.'},
{short:'Optional details',title:'Keep the details you need',y:791,h:197,text:'Toggle the moustache, goatee, throat guard, visor, turnbacks and tying cord. Build a complete helmet or a simpler combination.',tip:'Facial hair is available on the half masks; the chin mask uses no facial hair.'}]},
{label:'Materials',title:'Colour. Surface. Character.',file:'kabuto-sidebar-materials.webp',crop:285,topics:[
{short:'Part & surface',title:'Target a part and its surface',y:373,h:151,text:'Choose the part to edit, or use the selected object. Masks offer lacquered iron and carved wood; supported guards offer lacquer and odoshi lacing.',tip:'Use this surface on all masks copies the surface type. Adjust stain and ageing per part.'},
{short:'Tint & wear',title:'Control colour and ageing',y:541,h:265,text:'Adjust tint strength, maintained-to-aged wear and normal detail. Wood exposes stain and grain relief; odoshi exposes its cord, braid and other material regions.',tip:'The available controls change with the selected part and surface.'},
{short:'Palettes',title:'Ten coordinated starting points',y:810,h:115,text:'Choose a named palette or press Randomise colours to cycle through the ten coordinated schemes. All maintained and All aged set the overall condition.',tip:'Palette changes preserve wood stain, facial hair and fitting.'},
{short:'Texture export',title:'Export mask textures',y:932,h:39,text:'Bake the current appearance of all four masks to PBR textures, including masks that are currently hidden.',tip:'Save the .blend first. Start at 1K for a quick check before a larger export.'}]},
{label:'Fitting',title:'Adapt it to your character.',file:'kabuto-sidebar-fitting.webp',crop:320,topics:[
{short:'Head & face',title:'Establish the overall fit',y:405,h:116,text:'Use Head scale for overall size, then refine Head width and Face depth. Align the assembly to your character before fine adjustments.',tip:'Inspect the front and side views together; one view can hide intersections.'},
{short:'Clearance',title:'Give the face room',y:526,h:200,text:'Adjust jaw, facial-hair and mask clearance, then neck width and depth. These controls help adapt the chosen modules to the character.',tip:'Recheck after changing components. Some characters still need manual mesh adjustment.'},
{short:'Profile',title:'Refine the mask profile',y:767,h:48,text:'Profile correction adjusts the supported half-mask profile. Use it alongside the fitting controls and inspect the silhouette from the side.',tip:'This control depends on the selected mask. It is not a one-click fit for every head.'}]},
{label:'Studio',title:'Frame it. Render it.',file:'kabuto-sidebar-studio.webp',crop:390,topics:[
{short:'Cameras',title:'Frame the assembly or mask',y:431,h:111,text:'Choose a hero view, a front view or a mask close-up with the supplied studio cameras. F12 renders the active camera.',tip:'Check the framing and which objects are visible before rendering.'},
{short:'Render quality',title:'Balance quality and speed',y:539,h:111,text:'Adjust render size, samples and exposure from the sidebar. Use smaller previews while arranging the look, then increase quality for final images.',tip:'Use Rendered viewport shading and check scene lights and world settings when matching the final render.'},
{short:'Turntable',title:'Build a 360° camera orbit',y:686,h:361,text:'Set the frame count and FPS, build or reframe the turntable, then render a PNG sequence. The sequence can be encoded as a video or GIF.',tip:'Rebuild after changing parts or fitting. Set your output folder after building the orbit.'}]}
];let currentPanel=0,currentTopic=0;
const tabContainer=document.querySelector('.tabs'),topics=document.querySelector('.topic-list'),hotspots=document.getElementById('hotspots'),shot=document.getElementById('screenshot');
const tabs=panels.map((p,i)=>{const b=document.createElement('button');b.className='tab';b.type='button';b.textContent=p.label;b.setAttribute('aria-pressed',String(i===0));b.addEventListener('click',()=>showPanel(i));tabContainer.append(b);return b});
function showTopic(i){currentTopic=i;const topic=panels[currentPanel].topics[i];document.getElementById('control-title').textContent=topic.title;document.getElementById('description').textContent=topic.text;document.getElementById('tip').textContent=topic.tip;[...topics.children].forEach((b,j)=>b.setAttribute('aria-pressed',String(i===j)));[...hotspots.children].forEach((b,j)=>b.setAttribute('aria-pressed',String(i===j)))}
function showPanel(i){currentPanel=i;const p=panels[i];tabs.forEach((b,j)=>b.setAttribute('aria-pressed',String(i===j)));shot.src=p.file;shot.alt='Actual KABUTO '+p.label+' sidebar in Blender';shot.style.top=(-p.crop/760*100)+'%';document.getElementById('full-image').href=p.file;document.getElementById('panel-title').textContent=p.title;topics.replaceChildren();hotspots.replaceChildren();p.topics.forEach((t,j)=>{const b=document.createElement('button');b.className='topic';b.type='button';b.textContent=(j+1)+'. '+t.short;b.addEventListener('click',()=>showTopic(j));topics.append(b);const h=document.createElement('button');h.className='hotspot';h.type='button';h.style.top=((t.y-p.crop)/760*100)+'%';h.style.height=(t.h/760*100)+'%';h.setAttribute('aria-label','Explain '+t.title);const n=document.createElement('span');n.textContent=j+1;h.append(n);h.addEventListener('click',()=>showTopic(j));hotspots.append(h)});showTopic(0)}
showPanel(0);
</script></body></html>
