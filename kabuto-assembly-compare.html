<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="dark"><title>KABUTO · Assembly finishes</title><style>
@font-face{font-family:Kabuto;src:url('kabuto-ui-serif.woff2') format('woff2');font-display:swap}*{box-sizing:border-box}html,body{margin:0;background:#12191c;color:#eee7d8;font:14px/1.5 Arial,sans-serif}button{font:inherit;cursor:pointer;touch-action:manipulation}button:focus-visible{outline:2px solid #e1c68e;outline-offset:3px}.stage{--split:50%;position:relative;width:100%;aspect-ratio:16/9;overflow:hidden;background:#10171a;isolation:isolate;touch-action:pan-y}.side{position:absolute;inset:0;overflow:hidden}.side img{display:block;width:100%;height:100%;object-fit:contain;pointer-events:none}.iron{clip-path:inset(0 calc(100% - var(--split)) 0 0)}.divider{position:absolute;left:var(--split);top:0;bottom:0;width:1px;background:#e0c18b;pointer-events:none;transform:translateX(-50%)}.handle{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:42px;height:42px;display:grid;place-items:center;background:#182326ed;border:1px solid #e0c18b;border-radius:50%;font-size:23px}.range{position:absolute;inset:0;width:100%;height:100%;opacity:0;margin:0;cursor:ew-resize}.stage:focus-within{outline:2px solid #e0c18b;outline-offset:-2px}.badge{position:absolute;top:16px;padding:7px 10px;background:#11191ceb;border:1px solid #61716a;color:#e2d9c8;font-size:10px;letter-spacing:.07em;pointer-events:none}.badge.left{left:16px}.badge.right{right:16px}.stage.pair .side{width:50%;clip-path:none}.stage.pair .side img{object-fit:cover;object-position:center}.stage.pair .wood{left:50%}.stage.pair .divider,.stage.pair .range{display:none}.controls{height:200px;padding:18px 4%;background:linear-gradient(110deg,#1c282b,#12191c);border-top:1px solid #354346;display:flex;flex-direction:column;justify-content:space-between;gap:12px}.labels{display:grid;grid-template-columns:1fr 1fr;gap:24px}.labels strong{font:400 21px/1.25 Kabuto,Georgia,serif}.labels p{font-size:12px;line-height:1.5;color:#b8c2bd;margin:6px 0 0}.labels>div+div{padding-left:24px;border-left:1px solid #44504e}.buttons{display:flex;gap:8px;flex-wrap:wrap}button{min-height:36px;border:1px solid #5f6963;border-radius:3px;color:#e7dfce;background:transparent;padding:7px 12px;font-size:12px}button:hover{background:#293638}button[aria-pressed=true]{background:#8d362a;border-color:#b16b55}.note{font-size:10px;color:#aab8b7;margin:0}@media(max-width:520px){.badge{font-size:8px;top:10px;padding:5px 7px}.badge.left{left:9px}.badge.right{right:9px}.handle{width:34px;height:34px;font-size:20px}.controls{padding:13px 4%;gap:9px}.labels{gap:12px}.labels>div+div{padding-left:12px}.labels strong{font-size:16px}.labels p{font-size:10px}.buttons{gap:5px}button{font-size:10px;padding:6px 8px;min-height:34px}.note{font-size:9px}}
</style></head><body><main aria-label="Compare two KABUTO assembly finishes"><div class="stage" id="stage"><div class="side wood"><img src="kabuto-assembly-wood.webp" width="2560" height="1440" alt="Green helmet, carved wood mask and lacquer throat guard" draggable="false"></div><div class="side iron"><img src="kabuto-assembly-iron.webp" width="2560" height="1440" alt="Dark helmet, iron mask, teal cord and odoshi lacing on the throat guard" draggable="false"></div><div class="divider" aria-hidden="true"><span class="handle">↔</span></div><span class="badge left">IRON + ODOSHI</span><span class="badge right">WOOD + LACQUER</span><input id="range" class="range" type="range" min="0" max="100" value="50" aria-label="Amount of iron and odoshi assembly revealed" aria-valuetext="50 percent iron assembly revealed"></div><div class="controls"><div class="labels"><div><strong>Iron &amp; odoshi</strong><p>Lacquered iron mask<br>Textured lacing · teal tying cord</p></div><div><strong>Wood &amp; lacquer</strong><p>Carved-wood mask<br>Lacquer throat plates · natural cord</p></div></div><div class="buttons" aria-label="Comparison view"><button id="drag" aria-pressed="true">Drag comparison</button><button id="pair" aria-pressed="false">Side by side</button><button id="iron">Iron only</button><button id="wood">Wood only</button></div><p id="hint" class="note">Drag the divider, or use the arrow keys. Same framing · reference head not included.</p></div></main><script>
const stage=document.getElementById('stage'),range=document.getElementById('range'),drag=document.getElementById('drag'),pair=document.getElementById('pair'),hint=document.getElementById('hint');
function update(value){const n=Math.min(100,Math.max(0,Number(value)));range.value=n;stage.style.setProperty('--split',n+'%');range.setAttribute('aria-valuetext',n+' percent iron assembly revealed')}
function mode(paired){stage.classList.toggle('pair',paired);range.disabled=paired;drag.setAttribute('aria-pressed',String(!paired));pair.setAttribute('aria-pressed',String(paired));hint.textContent=paired?'Two finishes, one modular assembly. Reference head not included.':'Drag the divider, or use the arrow keys. Same framing · reference head not included.'}
drag.addEventListener('click',()=>{mode(false);update(50)});pair.addEventListener('click',()=>mode(true));document.getElementById('iron').addEventListener('click',()=>{mode(false);update(100)});document.getElementById('wood').addEventListener('click',()=>{mode(false);update(0)});range.addEventListener('input',()=>update(range.value));
let active=null;function pointer(e){const box=stage.getBoundingClientRect();update((e.clientX-box.left)/box.width*100)}range.addEventListener('pointerdown',e=>{if(e.button!==0)return;active=e.pointerId;range.focus({preventScroll:true});range.setPointerCapture(active);pointer(e);e.preventDefault()});range.addEventListener('pointermove',e=>{if(e.pointerId===active)pointer(e)});range.addEventListener('pointerup',e=>{if(e.pointerId===active){pointer(e);active=null}});range.addEventListener('pointercancel',()=>active=null);range.addEventListener('lostpointercapture',()=>active=null);
</script></body></html>
